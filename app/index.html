    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <noscript>
      <style>
        [data-reveal] {
          opacity: 1 !important;
          transform: none !important;
        }
      </style>
    </noscript>
  </head>
  <body>
    <script>
      /* Pre-React deep-link redirect so direct links work on every host:
           /cities/bishkek               -> /#/cities/bishkek
           /cities/bishkek/index.html    -> /#/cities/bishkek
           /cities/bishkek/              -> /#/cities/bishkek
         Runs before the bundle loads, so it works even if JS bundling is delayed. */
      (function () {
        var path = location.pathname.replace(/\/index\.html$/i, "/");
        if (location.hash || path === "/") return;
        if (/\.(js|css|json|png|jpe?g|svg|ico|txt|xml|webmanifest|woff2?)$/i.test(path)) return;
        path = "/" + path.replace(/^\/+|\/+$/g, "");
        if (path === "/") return;
        // keep the query BEFORE the hash: "/?lang=fa#/partners" — "location.search" must stay readable
        location.replace(location.origin + "/" + location.search + "#" + path);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
